[reality_nodes]
dzire ansible_python_interpreter=/usr/bin/python3 # Ansible 会自动去 ssh config 找 "dzire" 的配置

netcup ansible_python_interpreter=/usr/bin/python3 # Ansible 会自动去 ssh config 找 "netcup" 的配置

# 强制指定 ansible_user=root
#kagoya ansible_host=kagoya的IP地址 ansible_user=root ansible_python_interpreter=/usr/bin/python3
kagoya ansible_python_interpreter=/usr/bin/python3 # Ansible 会自动去 ssh config 找 "kagoya" 的配置

ams ansible_python_interpreter=/usr/bin/python3 # Ansible 会自动去 ssh config 找 "ams" 的配置

dcc ansible_python_interpreter=/usr/bin/python3 # Ansible 会自动去 ssh config 找 "dcc" 的配置

legend ansible_python_interpreter=/usr/bin/python3 # Ansible 会自动去 ssh config 找 "legend" 的配置

lc ansible_python_interpreter=/usr/bin/python3 # Ansible 会自动去 ssh config 找 "lc" 的配置

# 本机 (新增这行)
# 1. ansible_connection=local: 使用本地连接
# 2. ansible_python_interpreter: 显式指定 Python 路径(可选，防止警告)
spt ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[free]
netcup

[basic]
dzire
legend
lc

[normal]
spt
kagoya

[premium]
ams
dcc

