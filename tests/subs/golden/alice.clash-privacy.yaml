# 隐私模式：除局域网外全部经节点，包括国内网站；TUN 接管 TCP/UDP/IPv6，DNS 经节点规则远端解析。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: true
unified-delay: true
profile:
  store-selected: true
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  - tcp://any:53
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - +.local
  respect-rules: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://119.29.29.29/dns-query
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
proxies:
- name: alpha [tag]
  type: vless
  server: alpha.example.test
  port: 443
  uuid: 11111111-1111-4111-8111-111111111111
  udp: true
  tls: true
  servername: www.example.com
  client-fingerprint: chrome
  encryption: ''
  reality-opts:
    public-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAE
    short-id: a1a1a1a1
  network: tcp
  flow: xtls-rprx-vision
- name: alpha [tag]-xhttp
  type: vless
  server: alpha.example.test
  port: 443
  uuid: 11111111-1111-4111-8111-111111111111
  udp: true
  tls: true
  servername: www.example.com
  client-fingerprint: chrome
  encryption: ''
  reality-opts:
    public-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAE
    short-id: a1a1a1a1
  network: xhttp
  alpn:
  - h2
  xhttp-opts:
    path: /xp/synthetic
    mode: stream-one
- name: beta
  type: vless
  server: 198.51.100.7
  port: 20001
  uuid: 11111111-1111-4111-8111-111111111111
  udp: true
  tls: true
  servername: www.example.net
  client-fingerprint: chrome
  encryption: ''
  reality-opts:
    public-key: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCE
    short-id: b1b1b1b1
  network: tcp
  flow: xtls-rprx-vision
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO
  - alpha [tag]
  - alpha [tag]-xhttp
  - beta
- name: AUTO
  type: url-test
  proxies:
  - alpha [tag]
  - alpha [tag]-xhttp
  - beta
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
rules:
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
- IP-CIDR6,fc00::/7,DIRECT,no-resolve
- IP-CIDR6,fe80::/10,DIRECT,no-resolve
- IP-CIDR6,ff00::/8,DIRECT,no-resolve
- MATCH,PROXY
