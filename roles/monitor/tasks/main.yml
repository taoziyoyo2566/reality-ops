---
# roles/monitor/tasks/main.yml

- name: 确保系统安装了基础依赖
  apt:
    name: ["python3-pip", "python3-venv"]
    state: present
    update_cache: yes

- name: 在虚拟环境中安装 Python 依赖
  pip:
    name: ["requests", "fastapi", "uvicorn"]
    virtualenv: "{{ playbook_dir }}/monitor_venv"
    virtualenv_command: /usr/bin/python3 -m venv

# --- 服务端部署 (spt) ---
- name: "[Server] 部署监控服务端"
  when: inventory_hostname == monitor.server_host
  block:
    - name: 确保数据目录存在
      file:
        path: "{{ playbook_dir }}/data"
        state: directory
        mode: '0755'

    - name: 部署服务端脚本
      template:
        src: server.py.j2
        dest: "{{ playbook_dir }}/monitor_server.py"
        mode: '0755'
    
    - name: 配置 Systemd 服务
      copy:
        dest: /etc/systemd/system/reality-monitor.service
        content: |
          [Unit]
          Description=Reality Traffic Monitor
          After=network.target
          [Service]
          User=root
          WorkingDirectory={{ playbook_dir }}
          # 使用虚拟环境 Python 启动
          ExecStart={{ playbook_dir }}/monitor_venv/bin/python3 {{ playbook_dir }}/monitor_server.py
          Restart=always
          [Install]
          WantedBy=multi-user.target
      notify: 重启监控服务


# --- 客户端部署 (所有节点) ---
- name: "[Agent] 部署上报脚本"
  template:
    src: agent.py.j2
    dest: "/usr/local/bin/traffic_agent.py"
    mode: '0755'

- name: "[Agent] 设置 Crontab"
  cron:
    name: "Reality Traffic Report"
    minute: "*"
    job: "{{ playbook_dir }}/monitor_venv/bin/python3 /usr/local/bin/traffic_agent.py > /dev/null 2>&1"