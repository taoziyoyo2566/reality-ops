---
- name: Admin | 创建项目部署目录
  file:
    path: "{{ admin_root_dir | default('/opt/reality-ops') }}"
    state: directory
    mode: '0755'

- name: Admin | 复制项目文件
  copy:
    src: "{{ item }}"
    dest: "{{ admin_root_dir | default('/opt/reality-ops') }}/"
  loop:
    - admin_server.py
    - subscription.py
    - generate_user.py
    - requirements-admin.txt
    - inventory.ini
    - users/
    - scripts/
    - .env.sample

- name: Admin | 创建/更新 Python 虚拟环境
  command: "bash {{ admin_root_dir | default('/opt/reality-ops') }}/scripts/setup_admin_venv.sh"
  args:
    chdir: "{{ admin_root_dir | default('/opt/reality-ops') }}"
  changed_when: true

- name: Admin | 从模板生成 .env 文件
  template:
    src: env.j2
    dest: "{{ admin_root_dir | default('/opt/reality-ops') }}/.env"
    mode: '0600' # .env contains secrets, so it should be readable only by the owner
  notify: Restart admin service

- name: Admin | 从模板生成 systemd 服务文件
  template:
    src: reality-admin.service.j2
    dest: /etc/systemd/system/reality-admin.service
  notify: Restart admin service
