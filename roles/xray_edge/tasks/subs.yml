---
# canary 期间只给测试用户在控制端生成链接，不改 generate_subs_gist.py、Gist 与 /opt/reality/users。
- name: 创建控制端测试订阅目录
  delegate_to: localhost
  become: false
  file:
    path: "{{ edge_subs_dir }}"
    state: directory
    mode: "0700"

- name: 写入测试订阅链接
  delegate_to: localhost
  become: false
  vars:
    sni: "{{ reality_server_names[0] }}"
    label: "{{ item.name ~ '.' ~ inventory_hostname ~ '-edge' }}"
    common: "encryption=none&security=reality&sni={{ sni | urlencode }}&fp=chrome&pbk={{ edge_public_key | urlencode }}&sid={{ item.short_id }}"
  copy:
    dest: "{{ edge_subs_dir }}/{{ item.name }}_{{ inventory_hostname }}.txt"
    mode: "0600"
    # 只输出域名地址：域名同时有 A/AAAA 时由客户端（Happy Eyeballs）选择 IPv4 或 IPv6。
    content: |
      vless://{{ item.uuid }}@{{ node_endpoint }}:{{ edge_listen_port }}?{{ common }}&type=tcp&flow=xtls-rprx-vision#{{ label | urlencode }}
      {% if edge_xhttp_enabled | bool %}
      vless://{{ item.uuid }}@{{ node_endpoint }}:{{ edge_listen_port }}?{{ common }}&type=xhttp&path={{ edge_xhttp_path | urlencode | replace('/', '%2F') }}&mode={{ edge_xhttp_mode }}#{{ (label ~ '-xhttp') | urlencode }}
      {% endif %}
  loop: "{{ edge_users | selectattr('name', 'in', edge_test_users) | list }}"
  loop_control:
    label: "{{ item.name }}"
  diff: false
