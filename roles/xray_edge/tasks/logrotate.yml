---
# 日志轮转由 compose 服务 logrotate 执行；这里只渲染配置并在工具镜像中校验（plan-edge-compose §3.4）。
- name: 下发 xray_edge 日志轮转配置
  template:
    src: logrotate.conf.j2
    dest: "{{ edge_root_dir }}/rotate/logrotate.conf"
    owner: "0"
    group: "0"
    mode: "0644"
    validate: >-
      docker run --rm --network none --user 10000:10000 -v %s:/rotate/logrotate.conf:ro
      {{ edge_tools_image }} logrotate --debug --state /tmp/status /rotate/logrotate.conf
