---
# xray_edge：与旧 single/multi 并行的单实例数据面。只新增，不修改旧实例、旧目录或旧端口。
# 合同：docs/reviews/data-plane-edge/plan-single-instance-443-2026-09-15.md；
# compose 形态：docs/reviews/data-plane-edge/plan-edge-compose-2026-09-15.md（节点上只有 Docker + edge_root_dir）。

# edge.yml 已按 edge_nodes 选主机（先一台试点，再其余同时）；这里防止角色被别的 playbook 用在其他主机上。
- name: 只允许在 edge_nodes 列出的节点运行
  assert:
    that: inventory_hostname in edge_nodes
    fail_msg: "{{ inventory_hostname }} 不在 edge_nodes={{ edge_nodes }} 中。"

- name: 节点事实（REALITY target 校验、全局 IPv6、公网 IPv4）
  import_tasks: node_facts.yml

# 用户来源（plan-console-phase2 D-P2-1）：console 从控制台读取；files 是导入控制台之前的做法（users/*.yml 与 ACL）。
- name: 用户加载、校验与 ACL（与 deploy.yml 相同的计算，只在 files 来源时）
  import_tasks: acl.yml
  when: edge_user_source == 'files'

- name: 计算新实例用户与 SOCKS5（只依赖控制端数据）
  import_tasks: desired.yml

- name: 创建新实例目录
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ edge_root_dir }}", owner: "0", group: "0", mode: "0755" }
    - { path: "{{ edge_root_dir }}/state", owner: "0", group: "0", mode: "0700" }
    - { path: "{{ edge_root_dir }}/keys", owner: "0", group: "0", mode: "0700" }
    - { path: "{{ edge_root_dir }}/conf.d", owner: "0", group: "10000", mode: "0750" }
    - { path: "{{ edge_root_dir }}/logs", owner: "10000", group: "10000", mode: "0750" }
    - { path: "{{ edge_root_dir }}/rotate", owner: "0", group: "0", mode: "0755" }
    - { path: "{{ edge_root_dir }}/rotate/state", owner: "10000", group: "10000", mode: "0700" }
    - { path: "{{ edge_root_dir }}/spool", owner: "10000", group: "10000", mode: "0700" }
  loop_control:
    label: "{{ item.path }}"

- name: 检查固定 digest 镜像是否已存在
  community.docker.docker_image_info:
    name: "{{ edge_xray_image }}"
  register: edge_image_info

- name: 拉取固定 digest 镜像（digest 不可变，本地已有则无需重拉）
  community.docker.docker_image:
    name: "{{ edge_xray_image }}"
    source: pull
  when: (edge_image_info.images | default([])) | length == 0

- name: 工具镜像（应用器与日志轮转）
  import_tasks: tools_image.yml

- name: 下发期望状态（不含 REALITY 私钥）
  template:
    src: desired-state.json.j2
    dest: "{{ edge_root_dir }}/state/desired.json"
    owner: "0"
    group: "0"
    mode: "0600"
  diff: false

- name: 计算发布端口
  set_fact:
    # [::] 接收本机全部 IPv6 地址：节点有多个公网 IPv6 时，不依赖 AAAA 恰好指向 Ansible 选中的那一个。
    edge_published_ports: >-
      {{ ['0.0.0.0:' ~ edge_listen_port ~ ':' ~ edge_listen_port]
         + ((['[::]:' ~ edge_listen_port ~ ':' ~ edge_listen_port]) if (global_ipv6 | length > 0) else []) }}

- name: 下发 compose 项目定义
  template:
    src: compose.yaml.j2
    dest: "{{ edge_root_dir }}/compose.yaml"
    owner: "0"
    group: "0"
    mode: "0644"
    validate: "docker compose -f %s config --quiet"

- name: 日志轮转配置
  import_tasks: logrotate.yml

- name: 应用期望状态（节点本地密钥、conf.d 校验与替换、API 或重启）
  command: >-
    docker compose -f {{ edge_root_dir }}/compose.yaml run --rm -T --pull never applier apply
    --root {{ edge_root_dir }} --container {{ edge_container_name }} --image {{ edge_xray_image }}
    {{ '--rotate-report-token' if (edge_rotate_report_token | bool) else '' }}
  register: edge_apply
  changed_when: (edge_apply.stdout_lines | last | default('{}') | from_json).changed | default(false)
  failed_when: edge_apply.rc != 0

- name: 读取现有新实例容器
  community.docker.docker_container_info:
    name: "{{ edge_container_name }}"
  register: edge_existing

- name: 接管 S3 形态容器（无 compose 标签时先删除，keys 与 conf.d 保留）
  community.docker.docker_container:
    name: "{{ edge_container_name }}"
    state: absent
  when:
    - edge_existing.exists
    - (edge_existing.container.Config.Labels | default({}, true)).get('com.docker.compose.project') != edge_compose_project

- name: 运行 compose 项目（xray、logrotate 与开启时的 reporter）
  community.docker.docker_compose_v2:
    project_src: "{{ edge_root_dir }}"
    state: present
    pull: never
    remove_orphans: true
  register: edge_compose

# reporter 与 xray 共用网络命名空间；应用器重启 xray 后命名空间被替换，重启 reporter 使其加入新的命名空间。
- name: xray 重启后重启 reporter
  command: docker restart {{ edge_container_name }}_reporter
  when:
    - edge_report_enabled | bool
    - (edge_apply.stdout_lines | last | default('{}') | from_json).action | default('none') in ['restart']

- name: 核对运行中的用户与期望状态一致
  command: >-
    docker compose -f {{ edge_root_dir }}/compose.yaml run --rm -T --pull never applier verify
    --root {{ edge_root_dir }} --container {{ edge_container_name }} --image {{ edge_xray_image }}
  register: edge_verify
  changed_when: false

- name: 记录节点公钥与上报 token 哈希（均非秘密）
  set_fact:
    edge_public_key: "{{ (edge_verify.stdout_lines | last | from_json).public_key }}"
    edge_report_token_sha256: "{{ (edge_verify.stdout_lines | last | from_json).report_token_sha256 }}"

# 注册文件是控制台中节点与订阅数据的唯一来源（plan-console-phase1 §3.3）；含节点上用户的 UUID 与 XHTTP path。
- name: 创建控制台注册目录
  delegate_to: "{{ console_host }}"
  file:
    path: "{{ console_registry_dir }}"
    state: directory
    owner: "0"
    group: "{{ console_uid }}"
    mode: "0750"

- name: 向管理控制台登记本节点
  delegate_to: "{{ console_host }}"
  copy:
    dest: "{{ console_registry_dir }}/{{ inventory_hostname }}.json"
    owner: "0"
    group: "{{ console_uid }}"
    mode: "0640"
    content: >-
      {{ {
           'schema': 1,
           'node': inventory_hostname,
           'label': node_alias,
           'endpoint': node_endpoint,
           'port': edge_listen_port | int,
           'sni': reality_server_names[0],
           'public_key': edge_public_key,
           'xhttp': {'enabled': edge_xhttp_enabled | bool, 'path': edge_xhttp_path, 'mode': edge_xhttp_mode},
           'users': edge_users | sort(attribute='name'),
           'report': {'enabled': edge_report_enabled | bool, 'token_sha256': edge_report_token_sha256},
           'status_probe': edge_status_probe_enabled | bool,
           'sync': edge_sync_enabled | bool,
           'short_ids': ((edge_desired_users | map(attribute='short_id') | list) + (edge_extra_short_ids | default([])))
                        | unique | sort,
           'image': edge_xray_image
         } | to_nice_json(indent=1) }}
  no_log: true
  diff: false

- name: 清理 S3 形态的宿主机残留
  import_tasks: migrate_s3.yml

- name: 生成测试订阅链接（控制端，仅 edge_test_users）
  import_tasks: subs.yml
