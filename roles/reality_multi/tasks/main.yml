# --- 本地 JSON 生成部分 ---

- name: 生成用户节点 JSON 文件 (users/用户名_主机名.json)
  delegate_to: localhost
  copy:
    # 【注意】我保留了 _{{ inventory_hostname }} 防止多服务器覆盖
    # 如果你只有一台 VPS 或者确定要覆盖，可以改回 {{ item.name }}.json
    dest: "{{ playbook_dir }}/users/{{ item.name }}_{{ inventory_hostname }}.json"
    mode: '0644'
    content: |
      [
        {
          "user": "{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}",
          "id": "{{ item.uuid }}",
          "subscription": "vless://{{ item.uuid }}@{{ inventory_hostname }}{{ server_hash_suffix }}.{{ domain_suffix }}:{{ item.port }}?encryption=none&security=reality&type=tcp&sni={{ reality_server_names[0] }}&fp=chrome&pbk={{ item.public_key }}&sid={{ item.short_id }}&flow=xtls-rprx-vision#{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}"
        }
        {% if ansible_default_ipv6.address is defined %}
        ,{
          "user": "{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}",
          "id": "{{ item.uuid }}",
          "subscription": "vless://{{ item.uuid }}@{{ inventory_hostname }}{{ server_hash_suffix }}.{{ domain_suffix }}:{{ item.port }}?encryption=none&security=reality&type=tcp&sni={{ reality_server_names[0] }}&fp=chrome&pbk={{ item.public_key }}&sid={{ item.short_id }}&flow=xtls-rprx-vision#{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}_ipv6"
        }
        {% endif %}
      ]
  loop: "{{ reality_instances }}"
  loop_control:
    label: "{{ item.name }}"

- name: 配置 UFW 防火墙 (自动放行所有用户端口)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
  loop: []
  loop_control:
    label: "skip"
