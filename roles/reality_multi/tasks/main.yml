---
- name: 系统网络优化 (BBR + FastOpen + MTU Probing)
  block:
    # 1. 尝试加载 tcp_bbr 模块
    # 使用 failed_when: false 是为了兼容那些 BBR 已经编译进内核（非模块化）的系统
    - name: 确保 tcp_bbr 模块已加载
      community.general.modprobe:
        name: tcp_bbr
        state: present
      failed_when: false

    # 2. 写入配置文件
    - name: 写入 BBR 及优化配置文件
      copy:
        dest: /etc/sysctl.d/99-reality-optimizations.conf
        content: |
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_mtu_probing = 1
        mode: '0644'

    # 3. 应用系统配置 (使用 --system 确保加载所有配置，防止覆盖其他设置)
    - name: 应用 sysctl 配置
      command: sysctl --system
      changed_when: true

    # --- 4. 验证环节 (关键步骤) ---
    
    - name: 获取当前拥塞控制算法
      command: sysctl -n net.ipv4.tcp_congestion_control
      register: current_cc
      changed_when: false

    - name: 获取当前队列算法
      command: sysctl -n net.core.default_qdisc
      register: qdisc
      changed_when: false

    # 5. 断言检查：如果内核没有真正开启 BBR，则任务失败
    - name: 验证 BBR 是否成功开启
      assert:
        that:
          - "'bbr' in current_cc.stdout"
          - "'fq' in qdisc.stdout"
        fail_msg: |
          BBR 开启失败！
          当前算法: {{ current_cc.stdout }} (预期: bbr)
          当前队列: {{ qdisc.stdout }} (预期: fq)
          请检查内核版本是否 >= 4.9，或是否存在云服务商限制。
      when: not ansible_check_mode
  become: yes

- name: 停止并删除单实例容器 reality_core（避免端口占用）
  community.docker.docker_container:
    name: reality_core
    state: absent
  become: yes

- name: 获取当前监听端口
  command: ss -ltnH
  register: listen_ports
  changed_when: false

- name: 检查端口占用（多实例）
  vars:
    reality_ports: "{{ reality_instances | map(attribute='port') | map('string') | list }}"
    used_ports: "{{ listen_ports.stdout_lines | map('regex_search','(\\d+)$') | select('string') | list }}"
    conflict_ports: "{{ reality_ports | intersect(used_ports) }}"
  assert:
    that:
      - conflict_ports | length == 0
    fail_msg: "端口被占用: {{ conflict_ports | join(', ') }}"

- name: 安装 软件包 环境
  block:
    - name: 更新 apt 缓存
      apt:
        update_cache: yes
        cache_valid_time: 3600
    - name: 安装 软件包 及依赖
      apt:
        name: ["rsync", "curl", "wget", "tar","jq"]
        state: present

- name: 拉取 Xray Docker 镜像
  community.docker.docker_image:
    name: "{{ xray_image }}"
    source: pull

# 确保基础数据与日志目录存在
- name: 创建数据根目录
  file:
    path: "{{ reality_data_dir }}"
    state: directory
    mode: '0755'

- name: 创建日志根目录
  file:
    path: "{{ reality_logs_dir }}"
    state: directory
    mode: '0755'

# 核心循环：为每个实例准备环境
- name: 为每个用户创建配置目录
  file:
    path: "{{ reality_data_dir }}/{{ item.name }}"
    state: directory
    mode: '0755'
    recurse: yes
  loop: "{{ reality_instances }}"

- name: 生成每个用户的 config.json
  template:
    src: config.json.j2
    dest: "{{ reality_data_dir }}/{{ item.name }}/config.json"
    mode: '0644' # 【建议】配置文件的 owner 不需要改，0644 足够让容器里的用户读取
  loop: "{{ reality_instances }}"
  register: config_changed

# 修正日志目录权限
- name: 修正日志目录权限 (归属给 UID 10000)
  become: yes
  file:
    path: "{{ reality_logs_dir }}/{{ item.name }}"
    state: directory
    # 【确认】这步非常关键，配合 Dockerfile 的 USER 10000
    owner: "10000"
    group: "10000"
    mode: '0755'
    recurse: yes
  loop: "{{ reality_instances }}"

# 核心循环：启动容器
- name: 管理 Reality 多实例容器
  community.docker.docker_container:
    name: "reality_{{ item.name }}"
    image: "{{ xray_image }}"
    state: started
    restart_policy: always
    # 【新增】显式指定容器运行用户，双重保险 (配合 Dockerfile)
    user: "10000:10000"
    memory: "{{ reality_memory_limit | default('300m') }}"
    memory_swap: "{{ reality_memory_swap | default('1g') }}"
    memory_reservation: "{{ reality_memory_reservation | default('200m') }}"
    memory_swappiness: "{{ reality_mem_swappiness | default(60) }}"
    cpus: "1"
    ports:
      # 【确认】非Root容器内部监听 8443，映射到宿主机的 item.port
      - "{{ item.port }}:8443"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    volumes:
      - "{{ reality_data_dir }}/{{ item.name }}/config.json:/config.json:ro"
      - "{{ reality_logs_dir }}/{{ item.name }}:/var/log/xray"
    # 默认不强制重建，避免每次部署都重建所有容器；如需应用资源参数变更，可设置 reality_force_recreate=true
    recreate: "{{ reality_force_recreate | default(false) }}"
    restart: "{{ item.name in config_changed.results | selectattr('changed') | map(attribute='item.name') | list }}"
  loop: "{{ reality_instances }}"

