---
# ==============================================================================
# 1. 基础系统优化与检查 (保留原逻辑)
# ==============================================================================
- name: 系统网络优化 (BBR + FastOpen + MTU Probing)
  block:
    - name: 确保 tcp_bbr 模块已加载
      community.general.modprobe:
        name: tcp_bbr
        state: present
      failed_when: false

    - name: 写入 BBR 及优化配置文件
      copy:
        dest: /etc/sysctl.d/99-reality-optimizations.conf
        content: |
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_mtu_probing = 1
          net.ipv4.tcp_syncookies = 1
          net.ipv4.conf.all.rp_filter = 1
          net.ipv4.conf.default.rp_filter = 1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
        mode: '0644'

    - name: 应用 sysctl 配置
      command: sysctl --system
      register: sysctl_apply
      failed_when: false          # 某些内核缺少 nf_conntrack 等模块时返回非零，忽略
      changed_when: true

    - name: 提示 sysctl 非致命警告
      debug:
        msg: "{{ sysctl_apply.stderr_lines | default([]) }}"
      when: sysctl_apply.rc != 0

    - name: 获取当前拥塞控制算法
      command: sysctl -n net.ipv4.tcp_congestion_control
      register: current_cc
      changed_when: false

    - name: 获取当前队列算法
      command: sysctl -n net.core.default_qdisc
      register: qdisc
      changed_when: false

    - name: 验证 BBR 是否成功开启
      assert:
        that:
          - "'bbr' in current_cc.stdout"
          - "'fq' in qdisc.stdout"
        fail_msg: "BBR 开启失败！当前: {{ current_cc.stdout }} / {{ qdisc.stdout }}"
      when: not ansible_check_mode
  become: yes
  tags: ['system', 'bbr']

- name: 停止并删除单实例容器 reality_core（避免冲突）
  community.docker.docker_container:
    name: reality_core
    state: absent
  become: yes
  tags: ['users']

- name: 安装基础软件包 (含 rsync)
  apt:
    update_cache: yes
    cache_valid_time: 3600
    name: ["rsync", "curl", "docker-compose-plugin"] # 精简为当前角色所需
    state: present
  tags: ['system', 'docker']

- name: 检查 Xray 镜像是否已存在
  community.docker.docker_image_info:
    name: "{{ xray_image }}"
  register: xray_image_info
  failed_when: false
  changed_when: false
  tags: ['system', 'docker']

- name: 拉取 Xray 镜像（若本地不存在）
  community.docker.docker_image:
    name: "{{ xray_image }}"
    source: pull
  when: (xray_image_info.images | default([])) | length == 0
  tags: ['system', 'docker']

- name: 拉取/更新 Xray 镜像（仅在显式请求时）
  community.docker.docker_image:
    name: "{{ xray_image }}"
    source: pull
  when: "'update_image' in ansible_run_tags"
  tags: ['system', 'docker', 'update_image']

# ==============================================================================
# 2. [极致优化] 本地构建阶段 (Local Build)
#    在控制端本机生成所有文件，不再去远程服务器循环
# ==============================================================================
- name: 确保本地构建根目录存在
  delegate_to: localhost
  when: inventory_hostname == (ansible_play_hosts_all | first)
  file:
    path: "/tmp/reality_build"
    state: directory
    mode: '0755'
  tags: ['users']

- name: 清理当前主机的本地构建目录
  delegate_to: localhost
  file:
    path: "/tmp/reality_build/{{ inventory_hostname }}"
    state: absent
  tags: ['users']

- name: 确保当前主机本地构建目录存在
  delegate_to: localhost
  file:
    path: "/tmp/reality_build/{{ inventory_hostname }}/data"
    state: directory
    mode: '0755'
  tags: ['users']

- name: 创建本地构建目录结构
  delegate_to: localhost
  file:
    path: "/tmp/reality_build/{{ inventory_hostname }}/data/{{ item.name }}"
    state: directory
    mode: '0755'
  loop: "{{ reality_instances }}"
  tags: ['users']

- name: 本地生成用户配置文件 (config.json)
  delegate_to: localhost
  template:
    src: config.json.j2
    dest: "/tmp/reality_build/{{ inventory_hostname }}/data/{{ item.name }}/config.json"
    mode: '0644'
  loop: "{{ reality_instances }}"
  tags: ['users', 'config']

- name: 本地生成 Docker Compose 文件
  delegate_to: localhost
  template:
    src: docker-compose.yml.j2
    dest: "/tmp/reality_build/{{ inventory_hostname }}/docker-compose.yml"
    mode: '0644'
  tags: ['users', 'config']

- name: 校验 Docker Compose 文件语法 (本地)
  delegate_to: localhost
  command: docker compose -f "/tmp/reality_build/{{ inventory_hostname }}/docker-compose.yml" config
  changed_when: false
  tags: ['users', 'config']

# ==============================================================================
# 3. [极速同步] 批量部署 (Synchronize)
#    一次性将所有配置推送到服务器
# ==============================================================================
- name: 确保远程基础目录存在
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ reality_data_dir }}"
    - "{{ reality_logs_dir }}"
  tags: ['users']

- name: 检查远端 rsync 是否已安装（users 快速路径）
  command: which rsync
  register: rsync_check
  changed_when: false
  failed_when: false
  tags: ['users']

- name: 提示安装 rsync 后再运行 --tags users
  fail:
    msg: "目标主机 {{ inventory_hostname }} 缺少 rsync。请先在该主机安装 rsync（如：sudo apt-get update && sudo apt-get install -y rsync），或先执行带 system/docker 标签的部署。"
  when: rsync_check.rc != 0
  tags: ['users']

- name: 同步配置数据到服务器 (Local -> Remote)
  synchronize:
    src: "/tmp/reality_build/{{ inventory_hostname }}/data/"
    dest: "{{ reality_data_dir }}/"
    archive: yes
    delete: no # 保持增量更新，不误删
    recursive: yes
  # 注意：这步会把 data/user/config.json 推过去
  tags: ['users']

- name: 同步 Docker Compose 文件
  copy: # 单个文件用 copy 也很快，或者用 synchronize 也可以
    src: "/tmp/reality_build/{{ inventory_hostname }}/docker-compose.yml"
    dest: "{{ reality_data_dir }}/docker-compose.yml"
    mode: '0644'
  tags: ['users']

- name: 修正数据目录权限 (确保 UID 10000 可读)
  file:
    path: "{{ reality_data_dir }}"
    owner: "10000"
    group: "10000"
    recurse: yes
    mode: '0755'
  tags: ['users']

- name: 预创建日志目录并修正权限
  shell: |
    mkdir -p {{ reality_logs_dir }}/{{ item.name }}
    chown -R 10000:10000 {{ reality_logs_dir }}/{{ item.name }}
  loop: "{{ reality_instances }}"
  # 虽然这里用了 loop，但只是简单的 mkdir 命令，比 template 快得多。
  # 也可以优化为本地生成空目录一起 sync 过去，但这步通常不耗时。
  tags: ['users']

# ==============================================================================
# 4. [容器编排] 统一启动 (Docker Compose)
# ==============================================================================
- name: 启动/更新所有 Reality 服务
  community.docker.docker_compose_v2:
    project_src: "{{ reality_data_dir }}"
    state: present
    pull: never
    build: never  # 避免 compose 尝试 build，引发无服务可构建的警告
    remove_orphans: true # 自动清理掉不再列表里的旧容器
  register: compose_output
  when: (reality_instances | length) > 0
  tags: ['users', 'deploy']

- name: 当前节点无授权用户时清理多实例容器
  block:
    - name: 获取当前 reality_* 容器列表
      command: docker ps -a --format '{% raw %}{{.Names}}{% endraw %}'
      register: reality_containers
      changed_when: false
      failed_when: false

    - name: 删除多实例容器 (无授权用户)
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      loop: "{{ reality_containers.stdout_lines | select('match', '^reality_') | list }}"
      loop_control:
        label: "{{ item }}"
      when: reality_containers.stdout_lines | select('match', '^reality_') | list | length > 0
  when: (reality_instances | length) == 0
  tags: ['users', 'deploy']

- name: 显示 Compose 运行结果
  debug:
    msg: "服务已更新，受影响的服务: {{ compose_output.actions | default([]) }}"
  when: compose_output is defined
  tags: ['users']

# ==============================================================================
# 5. 后续处理 (本地 JSON 生成)
# ==============================================================================
- name: 创建本地订阅缓存目录
  delegate_to: localhost
  file:
    path: "/opt/reality/users"
    state: directory
    mode: '0755'
  tags: ['users', 'local_file']

- name: 清理当前主机的旧订阅缓存文件 (防止权限回收后残留)
  delegate_to: localhost
  shell: "rm -f /opt/reality/users/*_{{ inventory_hostname }}.json"
  args:
    warn: false
  failed_when: false
  tags: ['users', 'local_file']

- name: 生成用户节点 JSON 文件 (users/用户名_主机名.json)
  delegate_to: localhost
  copy:
    dest: "/opt/reality/users/{{ item.name }}_{{ inventory_hostname }}.json"
    mode: '0644'
    content: |
      [
        {
          "user": "{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}",
          "id": "{{ item.uuid }}",
          "subscription": "vless://{{ item.uuid }}@{{ inventory_hostname }}{{ server_hash_suffix }}.{{ domain_suffix }}:{{ item.port }}?encryption=none&security=reality&type=tcp&sni={{ reality_server_names[0] }}&fp=chrome&pbk={{ item.public_key }}&sid={{ item.short_id }}&flow=xtls-rprx-vision#{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}"
        }{% if ansible_default_ipv6 is defined and ansible_default_ipv6.address is defined %}
        ,
        {
          "user": "{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}",
          "id": "{{ item.uuid }}",
          "subscription": "vless://{{ item.uuid }}@[{{ ansible_default_ipv6.address }}]:{{ item.port }}?encryption=none&security=reality&type=tcp&sni={{ reality_server_names[0] }}&fp=chrome&pbk={{ item.public_key }}&sid={{ item.short_id }}&flow=xtls-rprx-vision#{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}_ipv6"
        }
        {% endif %}
      ]
  loop: "{{ reality_instances }}"
  loop_control:
    label: "{{ item.name }}"
  tags: ['users', 'local_file']
