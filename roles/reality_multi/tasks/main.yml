---
- name: 安装 Docker 环境
  block:
    - name: 更新 apt 缓存
      apt:
        update_cache: yes
        cache_valid_time: 3600
    - name: 安装 Docker
      apt:
        name: ["rsync", "curl", "wget", "tar"] # rsync 和其他工具依然通过 apt 安装
        state: present

- name: 拉取 Xray Docker 镜像
  community.docker.docker_image:
    name: "{{ xray_image }}"
    source: pull

# 核心循环：为每个实例准备环境
- name: 为每个用户创建配置目录
  file:
    path: "{{ playbook_dir }}/data/{{ item.name }}"
    state: directory
    mode: '0755'
    recurse: yes
  loop: "{{ reality_instances }}"

- name: 生成每个用户的 config.json
  template:
    src: config.json.j2
    dest: "{{ playbook_dir }}/data/{{ item.name }}/config.json"
    mode: '0600'
  loop: "{{ reality_instances }}"
  register: config_changed # 记录配置是否发生变化

# 核心循环：启动容器
- name: 管理 Reality 多实例容器
  community.docker.docker_container:
    name: "reality_{{ item.name }}"
    image: "{{ xray_image }}"
    state: started
    restart_policy: always
    # 限制资源（可选，复刻你想要的隔离效果）
    memory: "300m" 
    cpus: "0.5"
    ports:
      - "{{ item.port }}:443" # 关键：端口映射
    volumes:
      # 使用 item.name 区分每个用户的配置文件
      - "{{ playbook_dir }}/data/{{ item.name }}/config.json:/config.json:ro"
      # 使用 item.name 区分每个用户的日志
      - "{{ playbook_dir }}/data/{{ item.name }}/logs:/var/log/xray"

    # 如果上面的配置生成步骤显示 changed，则重启对应容器
    restart: "{{ item.name in config_changed.results | selectattr('changed') | map(attribute='item.name') | list }}"
  loop: "{{ reality_instances }}"

# 1. 始终输出 IPv4 链接
- name: 输出 IPv4 连接信息
  debug:
    msg: 
      - "用户: {{ item.name }}"
      - "地址: {{ inventory_hostname }}{{ server_hash_suffix }}.{{ domain_suffix }}"
      - "VLESS(IPv4): vless://{{ item.uuid }}@{{ inventory_hostname }}{{ server_hash_suffix }}.{{ domain_suffix }}:{{ item.port }}?encryption=none&security=reality&type=tcp&sni={{ reality_server_names[0] }}&fp=chrome&pbk={{ item.public_key }}&sid={{ item.short_id }}&flow=xtls-rprx-vision#{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}_ipv4"
  loop: "{{ reality_instances }}"
  loop_control:
    label: "{{ item.name }}"

# 2. 只有当检测到 IPv6 地址时，才输出 IPv6 链接
- name: 输出 IPv6 连接信息 (如果存在)
  debug:
    msg: 
      - "用户: {{ item.name }}"
      - "检测到 IPv6: {{ ansible_default_ipv6.address }}"
      - "VLESS(IPv6): vless://{{ item.uuid }}@{{ inventory_hostname }}{{ server_hash_suffix }}.{{ domain_suffix }}:{{ item.port }}?encryption=none&security=reality&type=tcp&sni={{ reality_server_names[0] }}&fp=chrome&pbk={{ item.public_key }}&sid={{ item.short_id }}&flow=xtls-rprx-vision#{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}_ipv6"
  loop: "{{ reality_instances }}"
  loop_control:
    label: "{{ item.name }}"
  # 核心判断逻辑：只有当 Ansible 收集到默认 IPv6 地址时才执行
  when: ansible_default_ipv6.address is defined

# ... (前面的任务保持不变) ...

- name: 生成用户节点 JSON 文件 (users/用户名.json)
  delegate_to: localhost
  copy:
    # 文件名格式：reap.json
    dest: "{{ playbook_dir }}/users/{{ item.name }}_{{ inventory_hostname }}.json"
    mode: '0644'
    content: |
      [
        {
          "user": "{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}",
          "id": "{{ item.uuid }}",
          "subscription": "vless://{{ item.uuid }}@{{ inventory_hostname }}{{ server_hash_suffix }}.{{ domain_suffix }}:{{ item.port }}?encryption=none&security=reality&type=tcp&sni={{ reality_server_names[0] }}&fp=chrome&pbk={{ item.public_key }}&sid={{ item.short_id }}&flow=xtls-rprx-vision#{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}_ipv4"
        }
        {% if ansible_default_ipv6.address is defined %}
        ,{
          "user": "{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}",
          "id": "{{ item.uuid }}",
          "subscription": "vless://{{ item.uuid }}@{{ inventory_hostname }}{{ server_hash_suffix }}.{{ domain_suffix }}:{{ item.port }}?encryption=none&security=reality&type=tcp&sni={{ reality_server_names[0] }}&fp=chrome&pbk={{ item.public_key }}&sid={{ item.short_id }}&flow=xtls-rprx-vision#{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}_ipv6"
        }
        {% endif %}
      ]
  loop: "{{ reality_instances }}"
  loop_control:
    label: "{{ item.name }}"