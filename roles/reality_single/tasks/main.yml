- name: 创建本地订阅缓存目录
  delegate_to: localhost
  file:
    path: "/opt/reality/users"
    state: directory
    mode: '0755'
  tags: ['users', 'local_file']

- name: 清理当前主机的旧订阅缓存文件 (防止权限回收后残留)
  delegate_to: localhost
  shell: "rm -f /opt/reality/users/*_{{ inventory_hostname }}.json"
  args:
    warn: false
  failed_when: false
  tags: ['users', 'local_file']

- name: 生成用户节点 JSON 文件
  delegate_to: localhost
  copy:
    dest: "/opt/reality/users/{{ item.name }}_{{ inventory_hostname }}.json"
    mode: '0644'
    content: |
      [
        {
          "user": "{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}",
          "id": "{{ item.uuid }}",
          "subscription": "vless://{{ item.uuid }}@{{ inventory_hostname }}{{ server_hash_suffix }}.{{ domain_suffix }}:{{ item.port }}?encryption=none&security=reality&type=tcp&sni={{ reality_server_names[0] }}&fp=firefox&pbk={{ item.public_key }}&sid={{ item.short_id }}&flow=xtls-rprx-vision#{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}"
        }
        {% if global_ipv6 | length > 0 %}
        ,
        {
          "user": "{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}",
          "id": "{{ item.uuid }}",
          "subscription": "vless://{{ item.uuid }}@[{{ global_ipv6 }}]:{{ item.port }}?encryption=none&security=reality&type=tcp&sni={{ reality_server_names[0] }}&fp=firefox&pbk={{ item.public_key }}&sid={{ item.short_id }}&flow=xtls-rprx-vision#{{ item.name }}.{{ inventory_hostname }}@{{ domain_suffix }}_ipv6"
        }
        {% endif %}
      ]
  loop: "{{ reality_instances }}"
  loop_control:
    label: "{{ item.name }}"
  tags: ['users', 'local_file']
# --- 单实例核心配置结束 ---
