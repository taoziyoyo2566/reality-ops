---
- name: 系统网络优化 (BBR + FastOpen + MTU Probing)
  block:
    # 1. 尝试加载 tcp_bbr 模块
    - name: 确保 tcp_bbr 模块已加载
      community.general.modprobe:
        name: tcp_bbr
        state: present
      failed_when: false  # 兼容内核已内置 BBR 的情况

    # 2. 写入配置文件
    - name: 写入 BBR 及优化配置文件
      copy:
        dest: /etc/sysctl.d/99-reality-optimizations.conf
        content: |
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_mtu_probing = 1
          net.ipv4.tcp_syncookies = 1
          net.ipv4.conf.all.rp_filter = 1
          net.ipv4.conf.default.rp_filter = 1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
        mode: '0644'

    # 3. 应用系统配置
    - name: 应用 sysctl 配置
      command: sysctl --system
      changed_when: true

    # 4. 验证
    - name: 获取当前拥塞控制算法
      command: sysctl -n net.ipv4.tcp_congestion_control
      register: current_cc
      changed_when: false

    - name: 获取当前队列算法
      command: sysctl -n net.core.default_qdisc
      register: qdisc
      changed_when: false

    - name: 验证 BBR 是否成功开启
      assert:
        that:
          - "'bbr' in current_cc.stdout"
          - "'fq' in qdisc.stdout"
        fail_msg: |
          BBR 开启失败！
          当前算法: {{ current_cc.stdout }} (预期: bbr)
          当前队列: {{ qdisc.stdout }} (预期: fq)
          请检查内核版本是否 >= 4.9，或是否存在云服务商限制。
      when: not ansible_check_mode
  become: yes
  tags: ['system', 'bbr']

- name: 清理多实例残留（从 multi 切回 single 时）
  tags: ['system', 'cleanup']
  block:
    - name: 获取当前 reality_* 容器列表
      command: docker ps -a --format '{% raw %}{{.Names}}{% endraw %}'
      register: reality_containers
      changed_when: false
      failed_when: false

    - name: 删除多实例容器 (保留 reality_core)
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      loop: "{{ reality_containers.stdout_lines | select('match', '^reality_') | reject('equalto', 'reality_core') | list }}"
      loop_control:
        label: "{{ item }}"
      when: reality_containers.stdout_lines | select('match', '^reality_') | reject('equalto', 'reality_core') | list | length > 0

    - name: 删除多实例 docker-compose 文件
      file:
        path: "{{ reality_data_dir }}/docker-compose.yml"
        state: absent

- name: 安装 Docker 环境
  block:
    - name: 更新 apt 缓存
      apt:
        update_cache: yes
        cache_valid_time: 3600
    - name: 安装 Docker 及依赖
      apt:
        name: ["rsync", "curl"]
        state: present
  tags: ['system', 'docker']

- name: 配置 Docker daemon 启用 IPv6 支持
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "ipv6": true,
        "fixed-cidr-v6": "fd00::/80"
      }
    mode: '0644'
  when: global_ipv6 | length > 0
  register: docker_daemon_config
  tags: ['system', 'docker']

- name: 重启 Docker daemon (IPv6 配置变更)
  systemd:
    name: docker
    state: restarted
  when: docker_daemon_config is changed
  tags: ['system', 'docker']

- name: 检查 Xray 镜像是否已存在
  community.docker.docker_image_info:
    name: "{{ xray_image }}"
  register: xray_image_info
  failed_when: false
  changed_when: false
  tags: ['system', 'docker']

- name: 拉取 Xray 镜像（若本地不存在）
  community.docker.docker_image:
    name: "{{ xray_image }}"
    source: pull
  when: (xray_image_info.images | default([])) | length == 0
  tags: ['system', 'docker']

- name: 拉取 Xray Docker 镜像
  community.docker.docker_image:
    name: "{{ xray_image }}"
    source: pull
  tags: ['system', 'docker', 'update_image']

# 确保基础数据与日志目录存在
- name: 创建数据根目录
  file:
    path: "{{ reality_data_dir }}"
    state: directory
    mode: '0755'
  tags: ['users', 'system']

- name: 创建日志根目录
  file:
    path: "{{ reality_logs_dir }}"
    state: directory
    mode: '0755'
  tags: ['users', 'system']

# --- 单实例核心配置开始 ---

- name: 创建统一配置目录
  file:
    path: "{{ reality_data_dir }}/reality_core"
    state: directory
    mode: '0755'
    recurse: yes
  tags: ['users']

- name: 生成聚合版 config.json
  template:
    src: config.json.j2
    dest: "{{ reality_data_dir }}/reality_core/config.json"
    mode: '0644'
  register: config_changed
  tags: ['users', 'config']

- name: 创建日志目录
  become: yes
  file:
    path: "{{ reality_logs_dir }}/reality_core"
    state: directory
    owner: "10000"
    group: "10000"
    mode: '0755'
    recurse: yes
  tags: ['users']

- name: 计算 Reality Core 端口绑定 (IPv4)
  set_fact:
    reality_core_ports_ipv4: "{{ reality_instances | map(attribute='port') | map('string') | map('regex_replace', '^(.*)$', '0.0.0.0:\\1:\\1') | list }}"
  tags: ['users']

- name: 计算 Reality Core 端口绑定 (IPv6，可选)
  set_fact:
    reality_core_ports_ipv6: "{{ (global_ipv6 | length > 0) | ternary(reality_instances | map(attribute='port') | map('string') | map('regex_replace', '^(.*)$', '[' ~ global_ipv6 ~ ']:\\1:\\1') | list, []) }}"
  tags: ['users']

- name: 汇总 Reality Core 端口绑定
  set_fact:
    reality_core_ports: "{{ reality_core_ports_ipv4 + reality_core_ports_ipv6 + ['127.0.0.1:10085:10085'] }}"
  tags: ['users']

- name: 启动 Reality 单实例容器 (管理所有用户)
  community.docker.docker_container:
    name: "reality_core"
    image: "{{ xray_image }}"
    state: started
    restart_policy: always
    network_mode: bridge
    
    # 显式指定用户
    user: "10000:10000"
    ports: "{{ reality_core_ports }}"
    
    # 挂载
    volumes:
      - "{{ reality_data_dir }}/reality_core/config.json:/config.json:ro"
      - "{{ reality_logs_dir }}/reality_core:/var/log/xray"
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opts:
      - no-new-privileges:true
    pids_limit: 256
    memory: "{{ reality_memory_limit }}"
    memory_reservation: "{{ reality_memory_reservation }}"
    memory_swap: "{{ reality_memory_swap }}"
    memory_swappiness: "{{ reality_mem_swappiness }}"
    ulimits:
      - "nofile:4096:8192"
      - "nproc:512:1024"

    # 只有当配置文件变动时才重启
    restart: "{{ config_changed.changed }}"
  tags: ['users', 'deploy']

