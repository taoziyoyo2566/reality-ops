---
- name: 系统网络优化 (BBR + FastOpen + MTU Probing)
  block:
    # 1. 尝试加载 tcp_bbr 模块
    - name: 确保 tcp_bbr 模块已加载
      community.general.modprobe:
        name: tcp_bbr
        state: present
      failed_when: false  # 兼容内核已内置 BBR 的情况

    # 2. 写入配置文件
    - name: 写入 BBR 及优化配置文件
      copy:
        dest: /etc/sysctl.d/99-reality-optimizations.conf
        content: |
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_mtu_probing = 1
        mode: '0644'

    # 3. 应用系统配置
    - name: 应用 sysctl 配置
      command: sysctl --system
      changed_when: true

    # 4. 验证
    - name: 获取当前拥塞控制算法
      command: sysctl -n net.ipv4.tcp_congestion_control
      register: current_cc
      changed_when: false

    - name: 获取当前队列算法
      command: sysctl -n net.core.default_qdisc
      register: qdisc
      changed_when: false

    - name: 验证 BBR 是否成功开启
      assert:
        that:
          - "'bbr' in current_cc.stdout"
          - "'fq' in qdisc.stdout"
        fail_msg: |
          BBR 开启失败！
          当前算法: {{ current_cc.stdout }} (预期: bbr)
          当前队列: {{ qdisc.stdout }} (预期: fq)
          请检查内核版本是否 >= 4.9，或是否存在云服务商限制。
  become: yes

- name: 安装 Docker 环境
  block:
    - name: 更新 apt 缓存
      apt:
        update_cache: yes
        cache_valid_time: 3600
    - name: 安装 Docker 及依赖
      apt:
        name: ["rsync", "curl", "wget", "tar"]
        state: present

- name: 拉取 Xray Docker 镜像
  community.docker.docker_image:
    name: "{{ xray_image }}"
    source: pull

# --- 单实例核心配置开始 ---

- name: 创建统一配置目录
  file:
    path: "{{ reality_data_dir }}/reality_core"
    state: directory
    mode: '0755'
    recurse: yes

- name: 生成聚合版 config.json
  template:
    src: config.json.j2
    dest: "{{ reality_data_dir }}/reality_core/config.json"
    mode: '0644'
  register: config_changed

- name: 创建日志目录
  become: yes
  file:
    path: "{{ reality_data_dir }}/reality_core/logs"
    state: directory
    owner: "10000"
    group: "10000"
    mode: '0755'
    recurse: yes

- name: 启动 Reality 单实例容器 (管理所有用户)
  community.docker.docker_container:
    name: "reality_core"
    image: "{{ xray_image }}"
    state: started
    restart_policy: always
    # 【必须】单实例管理多端口，必须用 Host 模式，否则端口映射写起来会非常麻烦
    network_mode: host
    
    # 显式指定用户
    user: "10000:10000"
    
    # 挂载
    volumes:
      - "{{ reality_data_dir }}/reality_core/config.json:/config.json:ro"
      - "{{ reality_data_dir }}/reality_core/logs:/var/log/xray"

    # 只有当配置文件变动时才重启
    restart: "{{ config_changed.changed }}"

