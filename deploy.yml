---
- hosts: reality_nodes
  become: yes
  
  pre_tasks:
    - name: 扫描用户配置文件
      find:
        paths: "{{ playbook_dir }}/users"
        patterns: '*.yml,*.yaml'
      register: user_config_files
      delegate_to: localhost
      run_once: true

    - name: 加载所有用户配置
      set_fact:
        reality_instances: "{{ reality_instances | default([]) + [ lookup('file', item.path) | from_yaml ] }}"
      loop: "{{ user_config_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: 初始化过滤后的实例列表
      set_fact:
        reality_instances_filtered: []

    - name: 过滤过期或等级不足的用户
      set_fact:
        reality_instances_filtered: "{{ reality_instances_filtered + [item] }}"
      loop: "{{ reality_instances | default([]) }}"
      vars:
        today: "{{ ansible_date_time.date | to_datetime('%Y-%m-%d') }}"
        expiry: "{{ (item.expire_at | default('9999-12-31')) | to_datetime('%Y-%m-%d') }}"
        node_level_effective: "{{ node_level | default(node_level_default | default(0)) | int }}"
        user_level_effective: "{{ item.access_level | default(access_level_default | default(1)) | int }}"
      when:
        - user_level_effective >= node_level_effective
        - expiry >= today

    - name: 覆盖 reality_instances 为过滤后的列表
      set_fact:
        reality_instances: "{{ reality_instances_filtered | default([]) }}"

  roles:
    # reality_mode: 单实例/多实例切换；默认 single
    - role: reality_single
      when: reality_mode | default('single') == 'single'
      tags: ['users', 'deploy']  # <--- 新增 Tag

    - role: reality_multi
      when: reality_mode | default('single') == 'multi'
      tags: ['users', 'deploy']  # <--- 新增 Tag

    # 监控可通过 monitor_enabled 关闭（多实例时默认建议关闭）
    - role: monitor
      when: monitor_enabled | default(true)

  # =========================================================
  # 🟢 核心修改：使用 post_tasks 代替独立的 localhost play
  # =========================================================
  post_tasks:
    - name: 执行脚本更新 GitHub Gist
      tags: ['users']
      command: python3 {{ playbook_dir }}/generate_subs_gist.py
      delegate_to: localhost  # 强制在本机执行
      run_once: true          # 无论同时部署几台 VPS，这个脚本只跑一次
      register: gist_result
      changed_when: "'Gist 更新成功' in gist_result.stdout"
      environment:
        GITHUB_TOKEN: "{{ vault_github_token | default('') }}"
        GIST_ID: "{{ vault_monitor_gist_id | default('0a7faae910b06151d643c7d5baa43818') }}"
        GITHUB_USER: "{{ vault_monitor_gist_user | default('') }}"
        SUBS_BASE_URL: "{{ monitor.subs_base_url | default(monitor.server_url) }}"
        SUBS_TOKEN: "{{ vault_monitor_subs_token | default('') }}"
      when: (vault_github_token | default('')) | length > 0

    - name: 跳过 Gist 更新（未配置 GITHUB_TOKEN）
      debug:
        msg: "未设置 vault_github_token，已跳过 Gist 更新。"
      run_once: true
      when: (vault_github_token | default('')) | length == 0
      
    - name: 显示订阅链接信息
      debug:
        var: gist_result.stdout_lines
      run_once: true

# 🔴 注意：文件末尾不要再有 - hosts: localhost 的段落了
