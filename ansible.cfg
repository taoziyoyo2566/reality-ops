[defaults]
inventory = inventory.ini
callbacks_enabled = profile_tasks, timer
bin_ansible_callbacks = True
# 提升并发，适合多 VPS 同步
forks = 20

# --- 关键修改 1: 改回 default，消除黄色警告 ---
stdout_callback = default

# 保持 Host Key 校验开启，首次接入使用 OpenSSH accept-new 做 TOFU
host_key_checking = True

retry_files_enabled = False
fact_caching = jsonfile
fact_caching_connection = .ansible/facts

[ssh_connection]
pipelining = True
# 10分钟的长连接非常合适；accept-new 保留首次接入体验，同时仍能发现主机密钥漂移
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o StrictHostKeyChecking=accept-new

# --- 新标准: 让默认输出变成 YAML 格式 ---
[callback_default]
result_format = yaml
