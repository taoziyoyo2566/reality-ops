---
# S4 订阅服务：部署 compose 项目到 subs_host。
#   ./monitor_venv/bin/ansible-playbook -i inventory.ini subs.yml -K --vault-password-file ~/.vault_pass
# 合同：docs/reviews/subscription-service/plan-subscription-service-2026-09-15.md（§10 2026-09-17）
# 订阅数据（catalog.json、tokens.json）由管理控制台生成并写入（D-C1，console.yml）；本 playbook 不再汇总节点数据，
# 也不连接任何节点。原先的汇总构建见 Git 历史与 subs/build.py（回滚时使用，plan-console-phase1 §3.8）。

# hosts 须与 group_vars/all/subs.yml 的 subs_host 一致（play 目标解析时读不到 group_vars）；角色内 assert 核对。
- name: 部署订阅服务
  hosts: spt
  gather_facts: false
  become: true
  tasks:
    - name: 部署订阅服务
      import_role:
        name: subs_service

    # 控制端旧构建目录含上次汇总的 catalog（有用户 UUID）；改由控制台发布后不再使用。
    - name: 删除控制端旧构建目录
      delegate_to: localhost
      become: false
      file:
        path: "{{ subs_legacy_build_dir }}"
        state: absent
