name: Sync Xray Release Images

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'

concurrency:
  group: xray-image-alias-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      missing_count: ${{ steps.releases.outputs.missing_count }}
      stable_tag: ${{ steps.releases.outputs.stable_tag }}
      stable_version: ${{ steps.releases.outputs.stable_version }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Discover release window and missing tags
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash docker-build/discover-release-window.sh taoziyoyo2566/xray_docker

      - name: Report synchronization plan
        env:
          MISSING_COUNT: ${{ steps.releases.outputs.missing_count }}
          STABLE_TAG: ${{ steps.releases.outputs.stable_tag }}
        shell: bash
        run: |
          {
            echo '## Xray release synchronization plan'
            echo
            echo "- Stable tag: \`${STABLE_TAG}\`"
            echo "- Missing immutable tags: \`${MISSING_COUNT}\`"
            echo
            echo 'The window contains the newest non-draft stable release and every newer non-draft prerelease.'
          } >> "${GITHUB_STEP_SUMMARY}"

  build-missing:
    needs: discover
    if: needs.discover.outputs.missing_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      IMAGE_NAME: taoziyoyo2566/xray_docker
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Protect immutable version tag
        shell: bash
        run: >-
          bash docker-build/check-image-tag-available.sh
          "${IMAGE_NAME}" "${{ matrix.image_tag }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.taoziyoyo.xray.version=${{ matrix.version }}
            io.taoziyoyo.xray.image-tag=${{ matrix.image_tag }}
            io.taoziyoyo.xray.image-revision=${{ matrix.revision }}
            io.taoziyoyo.xray.channel=${{ matrix.channel }}

      - name: Build and push image candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker-build
          file: ./docker-build/dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            XRAY_VERSION=${{ matrix.version }}
            XRAY_SHA256_AMD64=${{ matrix.amd64_sha }}
            XRAY_SHA256_ARM64=${{ matrix.arm64_sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=xray-${{ matrix.image_tag }}
          cache-to: type=gha,mode=max,scope=xray-${{ matrix.image_tag }}

      - name: Verify pushed multi-platform image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ matrix.version }}
        shell: bash
        run: bash docker-build/verify-image.sh "${IMAGE_REF}" "${VERSION}"

      - name: Recheck immutable version tag
        shell: bash
        run: >-
          bash docker-build/check-image-tag-available.sh
          "${IMAGE_NAME}" "${{ matrix.image_tag }}"

      - name: Publish immutable version tag
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ matrix.image_tag }}
        shell: bash
        run: docker buildx imagetools create --tag "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_REF}"

      - name: Report published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ matrix.image_tag }}
          VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          {
            echo "## Published ${IMAGE_TAG}"
            echo
            echo "- Xray version: \`${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platforms: \`linux/amd64,linux/arm64\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  reconcile-latest:
    needs: [discover, build-missing]
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      (needs.build-missing.result == 'success' || needs.build-missing.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: taoziyoyo2566/xray_docker
      STABLE_TAG: ${{ needs.discover.outputs.stable_tag }}
      STABLE_VERSION: ${{ needs.discover.outputs.stable_version }}
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Resolve stable and latest digests
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          read_digest() {
            local tag="$1"
            curl --fail --silent --show-error --location \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${tag}" \
              | jq -r '.digest'
          }
          stable_digest=''
          for attempt in 1 2 3 4 5; do
            stable_digest="$(read_digest "${STABLE_TAG}" 2>/dev/null || true)"
            [[ "${stable_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            sleep 5
          done
          if [[ ! "${stable_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "stable tag is unavailable after synchronization: ${STABLE_TAG}" >&2
            exit 1
          fi
          latest_digest="$(read_digest latest 2>/dev/null || true)"
          {
            echo "stable_digest=${stable_digest}"
            echo "move_latest=$([[ "${latest_digest}" == "${stable_digest}" ]] && echo false || echo true)"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify current stable image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.tags.outputs.stable_digest }}
        shell: bash
        run: bash docker-build/verify-image.sh "${IMAGE_REF}" "${STABLE_VERSION}"

      - name: Login to Docker Hub
        if: steps.tags.outputs.move_latest == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Move latest to verified stable
        if: steps.tags.outputs.move_latest == 'true'
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.tags.outputs.stable_digest }}
        shell: bash
        run: docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_REF}"

      - name: Report stable identity
        env:
          DIGEST: ${{ steps.tags.outputs.stable_digest }}
          MOVED: ${{ steps.tags.outputs.move_latest }}
        shell: bash
        run: |
          {
            echo '## Current stable image'
            echo
            echo "- Version tag: \`${STABLE_TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- latest moved: \`${MOVED}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
