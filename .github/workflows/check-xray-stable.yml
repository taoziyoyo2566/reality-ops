name: Check Upstream Stable Xray Release

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Check stable release pin
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash docker-build/check-inputs.sh
          pinned_version="$(tr -d '[:space:]' < docker-build/XRAY_VERSION)"
          release_json="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            'https://api.github.com/repos/XTLS/Xray-core/releases/latest')"
          upstream_version="$(jq -r '.tag_name' <<< "${release_json}")"
          upstream_prerelease="$(jq -r '.prerelease' <<< "${release_json}")"
          upstream_draft="$(jq -r '.draft' <<< "${release_json}")"

          if [[ "${upstream_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ &&
                "${upstream_prerelease}" == 'false' &&
                "${upstream_draft}" == 'false' ]]; then
            :
          else
            echo '::error::GitHub latest does not identify a valid final Xray release'
            exit 1
          fi

          drift=false
          if [[ "${pinned_version}" != "${upstream_version}" ]]; then
            drift=true
          else
            for asset in Xray-linux-64.zip Xray-linux-arm64-v8a.zip; do
              api_sha="$(jq -r --arg asset "${asset}" \
                '.assets[] | select(.name == $asset) | .digest' <<< "${release_json}")"
              file_sha="$(awk -v asset="${asset}" \
                '$2 == asset { print "sha256:" $1 }' docker-build/XRAY_SHA256SUMS)"
              if [[ -z "${api_sha}" || "${api_sha}" != "${file_sha}" ]]; then
                drift=true
              fi
            done
          fi

          {
            echo '## Upstream stable Xray check'
            echo
            echo "- Repository pin: \`${pinned_version}\`"
            echo "- Upstream final release: \`${upstream_version}\`"
            echo "- Version or asset drift: \`${drift}\`"
            echo
            echo 'A final release must be rebuilt from its final official assets.'
            echo 'This read-only workflow never promotes a prerelease image or writes Docker Hub.'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${drift}" == 'true' ]]; then
            echo "::error::Update the stable version and checksums through a reviewed PR; merging it triggers a fresh stable build"
            exit 1
          fi
