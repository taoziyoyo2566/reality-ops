name: Repository quality checks

on:
  pull_request:
  push:
    branches:
      - ops

jobs:
  xray-image-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Validate Xray image tooling
        run: |
          bash -n docker-build/check-inputs.sh
          bash -n docker-build/check-release-state.sh
          bash -n docker-build/resolve-image-repair.sh
          bash -n docker-build/resolve-rollback-image.sh
          bash -n docker-build/audit-image-tags.sh
          bash -n docker-build/select-image-channels.sh
          bash -n docker-build/verify-image.sh
          bash -n tests/test_xray_release_state.sh
          bash -n tests/test_xray_image_repair.sh
          bash -n tests/test_xray_image_tag_audit.sh
          bash -n tests/test_xray_image_channel_selection.sh
          bash -n tests/test_xray_rollback_resolution.sh
          bash -n tests/test_xray_image_workflow.sh
          bash -n tests/test_xray_image_verify.sh
          bash docker-build/check-inputs.sh
          bash docker-build/check-inputs.sh \
            docker-build/XRAY_PRERELEASE_VERSION \
            docker-build/XRAY_PRERELEASE_SHA256SUMS
          bash tests/test_xray_release_state.sh
          bash tests/test_xray_image_repair.sh
          bash tests/test_xray_image_tag_audit.sh
          bash tests/test_xray_image_channel_selection.sh
          bash tests/test_xray_rollback_resolution.sh
          bash tests/test_xray_image_workflow.sh
          bash tests/test_xray_image_verify.sh

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check trailing whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -n "${BASE_SHA}" ]]; then
            git diff --check "${BASE_SHA}...${AFTER_SHA}"
          elif [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${AFTER_SHA}^" "${AFTER_SHA}"
          else
            git diff --check "${BEFORE_SHA}" "${AFTER_SHA}"
          fi
