name: Repository quality checks

on:
  pull_request:
  push:
    branches:
      - ops

jobs:
  config-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Jinja2
        run: pip install --quiet 'jinja2>=3.1'

      - name: Check the socks5 outbound and its routing rule stay in lockstep
        run: python tests/test_socks5_gate.py

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check trailing whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -n "${BASE_SHA}" ]]; then
            git diff --check "${BASE_SHA}...${AFTER_SHA}"
          elif [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${AFTER_SHA}^" "${AFTER_SHA}"
          else
            git diff --check "${BEFORE_SHA}" "${AFTER_SHA}"
          fi
