name: Audit Xray Image Tags

on:
  workflow_dispatch:
  schedule:
    - cron: '29 5 * * 1'

concurrency:
  group: xray-image-registry-state
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Audit public tags
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report="$(bash docker-build/audit-image-tags.sh)"
          printf '%s\n' "${report}"
          {
            echo '# Xray Docker Hub tag audit'
            echo
            echo 'This workflow is read-only and never deletes tags.'
            echo
            echo '```text'
            printf '%s\n' "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report legacy tag debt
        if: >-
          steps.audit.outputs.cleanup_count != '0' ||
          steps.audit.outputs.review_count != '0'
        env:
          CLEANUP_COUNT: ${{ steps.audit.outputs.cleanup_count }}
          REVIEW_COUNT: ${{ steps.audit.outputs.review_count }}
        shell: bash
        run: |
          echo "::warning::Legacy Docker Hub tags: cleanup=${CLEANUP_COUNT}, review=${REVIEW_COUNT}"

      - name: Fail on missing required tags
        if: steps.audit.outputs.missing_count != '0'
        env:
          MISSING_COUNT: ${{ steps.audit.outputs.missing_count }}
        shell: bash
        run: |
          echo "::error::Docker Hub is missing ${MISSING_COUNT} required tag(s)"
          exit 1
