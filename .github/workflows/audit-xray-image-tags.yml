name: Audit Xray Image Tags

on:
  workflow_dispatch:
  schedule:
    - cron: '29 5 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Audit public tags
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          report="$(bash docker-build/audit-image-tags.sh)"
          printf '%s\n' "${report}"
          {
            echo '# Xray Docker Hub tag audit'
            echo
            echo 'This workflow is read-only and never deletes tags.'
            echo
            echo '```text'
            printf '%s\n' "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail on tag drift
        if: >-
          steps.audit.outputs.cleanup_count != '0' ||
          steps.audit.outputs.review_count != '0' ||
          steps.audit.outputs.missing_count != '0'
        env:
          CLEANUP_COUNT: ${{ steps.audit.outputs.cleanup_count }}
          MISSING_COUNT: ${{ steps.audit.outputs.missing_count }}
          REVIEW_COUNT: ${{ steps.audit.outputs.review_count }}
        shell: bash
        run: |
          echo "::error::Docker Hub tag drift: cleanup=${CLEANUP_COUNT}, review=${REVIEW_COUNT}, missing=${MISSING_COUNT}"
          exit 1
