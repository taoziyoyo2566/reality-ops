---
# 1. 部署服务端 (只在 spt 上)
- hosts: spt
  become: yes
  tasks:
    - name: 创建监控目录
      file:
        path: /opt/reality/monitor
        state: directory
        mode: '0755'

    - name: 安装服务端依赖
      pip:
        name: ["fastapi", "uvicorn"]
        break_system_packages: true # 允许在系统环境安装

    - name: 部署服务端代码
      copy:
        src: monitor/server.py
        dest: /opt/reality/monitor/server.py
        mode: '0755'
      notify: 重启监控服务

    - name: 配置 Systemd 服务
      template:
        src: monitor/server.service.j2
        dest: /etc/systemd/system/traffic-monitor.service
      notify: 重启监控服务

  handlers:
    - name: 重启监控服务
      systemd:
        name: traffic-monitor
        state: restarted
        enabled: yes
        daemon_reload: yes

# 2. 部署客户端 (在所有节点上)
- hosts: reality_nodes
  become: yes
  tasks:
    - name: 安装客户端依赖
      pip:
        name: requests
        break_system_packages: true

    - name: 创建脚本目录
      file:
        path: /opt/reality/monitor
        state: directory
        mode: '0755'

    - name: 部署上报 Agent
      template:
        src: monitor/agent.py.j2
        dest: /opt/reality/monitor/agent.py
        mode: '0755'

    - name: 设置 Crontab (每分钟上报)
      cron:
        name: "Reality Traffic Report"
        minute: "*"
        job: "/usr/bin/python3 /opt/reality/monitor/agent.py > /dev/null 2>&1"
