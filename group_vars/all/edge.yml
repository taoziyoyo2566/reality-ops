# 新数据面 xray_edge（单实例 · 443 · XHTTP），与现有 single/multi 并行运行。
# 实施合同：docs/reviews/data-plane-edge/plan-single-instance-443-2026-09-15.md
# 只被 edge.yml / edge-remove.yml 使用；旧实现不读取任何 edge_* 变量。

# 允许运行新实例的节点；edge.yml 对未列出的节点直接失败。
edge_nodes: ["dzire", "usca", "legend", "kagoya"]

# 只加入新实例、不改用户档案的额外用户（canary 测试账号）。不得与该节点的 ACL 结果重复。
edge_extra_users: ["test"]
# 在控制端生成测试订阅链接的用户；必须是该节点新实例上的用户。
edge_test_users: ["test"]

# 固定 digest：v26.3.27（amd64/arm64 index），2026-09-15 于 Docker Hub 核对。
edge_xray_image: "taoziyoyo2566/xray-docker@sha256:fd502666d1a9ca7ea772e2c1638bb83e79bdc12c97cddd5e3755edc7485b3ec7"

edge_root_dir: "/opt/xray-edge"
edge_container_name: "xray_edge"
# compose 项目名；容器名仍为 edge_container_name（应用器与核对命令依赖它）。
edge_compose_project: "xray-edge"
edge_node_name: "{{ inventory_hostname }}"

# 工具镜像（应用器 + 日志轮转），合同 plan-edge-compose §3.3。canary 按 D-E1 B 在控制端构建后 docker save/load 分发，
# 以镜像 ID 核对；标签取构建输入的哈希（tasks/tools_image.yml）。
edge_tools_repository: "reality-edge-tools"
# 工具镜像构建上下文（仓库根目录）。
edge_repo_dir: "{{ playbook_dir }}"
# 控制端导出镜像的私有目录（不在仓库内）。
edge_tools_export_dir: "{{ lookup('env', 'HOME') }}/.local/share/reality-ops/edge-images"
edge_listen_port: 443
edge_log_level: "warning"

# 第二步（XHTTP）：列入 edge_xhttp_nodes 的节点开启；path 每节点随机生成，保存在 vault 的 vault_edge_xhttp_paths。
edge_xhttp_nodes: ["dzire", "usca"]
edge_xhttp_enabled: "{{ inventory_hostname in edge_xhttp_nodes }}"
edge_xhttp_path: "{{ (vault_edge_xhttp_paths | default({})).get(inventory_hostname, '') }}"
edge_xhttp_mode: "auto"
# 出站 IPv4/IPv6 竞速（Xray happyEyeballs，推荐值 tryDelayMs 250）：列入的节点对双栈目标按先建立连接者选择地址族。
# 仅对有 IPv6 出口的节点有意义；roadmap S8 独立功能，先 canary。
edge_happy_eyeballs_nodes: ["usca", "legend"]
edge_happy_eyeballs_enabled: "{{ inventory_hostname in edge_happy_eyeballs_nodes }}"
# Mihomo 没有 auto；Xray 在 REALITY 下 auto 选择 stream-one（XTLS/Xray-core discussion #4113），Clash 片段与之一致。
edge_mihomo_xhttp_mode: "stream-one"

# 节点上报（管理控制台第一阶段，plan-console-phase1 §3.4）：开启 Xray metrics（首次开启时 Xray 重启一次），
# 并运行 reporter 每 edge_report_interval 秒把各用户流量与节点状态发到控制台。
# 默认跟随新系统节点：新节点部署时自动上报，不另外维护名单。
edge_report_nodes: "{{ edge_nodes }}"
edge_report_enabled: "{{ inventory_hostname in edge_report_nodes }}"
edge_report_url: "https://{{ console_report_host }}/report"
edge_report_interval: 300
# 只在需要换节点上报 token 时用 -e edge_rotate_report_token=true 运行 edge.yml；同一次运行会把新哈希登记到控制台。
edge_rotate_report_token: false
# 状态页探测账号：节点列表与账号参数在 group_vars/all/status.yml。
edge_status_probe_enabled: "{{ inventory_hostname in status_probe_nodes }}"

# 新实例容器的 DNS。REALITY 每次握手都要解析 target，Go 解析器对无响应的服务器单次等待 5s，
# 宿主机首个 DNS 丢包时每个新连接都会多等约 5s（2026-09-15 dzire 实测 4.2.2.4 丢包过半）。
# 只为列出的节点覆盖；未列出的节点继承宿主机 resolv.conf。
edge_container_dns:
  dzire:
    servers: ["8.8.8.8", "1.1.1.1"]
    options: ["timeout:1", "attempts:2"]

# 容器资源与日志上界
edge_memory_limit: "300m"
edge_memory_reservation: "200m"
edge_memory_swap: "1g"
edge_docker_log_max_size: "10m"
edge_docker_log_max_file: "3"
edge_log_rotate_keep: 14
edge_log_rotate_maxsize: "50M"
# logrotate 的 maxsize 只在运行时检查；compose 内 logrotate 容器按此间隔（秒）运行。
edge_logrotate_interval: 3600

# edge.yml 部署前读取旧实例用户并提示与新实例的差异，只提示、不中止（D-C5，2026-09-17）。
# 设为 true 时不读取旧实例、不做比较。
edge_skip_drift_check: false

# 测试订阅链接写到控制端此目录（不在仓库内；目录 0700、文件 0600）。
edge_subs_dir: "{{ lookup('env', 'HOME') }}/.local/share/reality-ops/edge-subs"
