# group_vars/all.yml

xray_image: "taoziyoyo2566/xray_docker:latest"
domain_suffix: "taoziyoyo.com"
server_hash_suffix: "o9drrm5l1d7uopaguucnxohzc3ul2yazxrldzpuoduu"
reality_server_names: ["www.apple.com", "images.apple.com"]
reality_dest: "www.apple.com:443"
reality_data_dir: "/opt/data"
monitor_root_dir: "/opt/monitor"
monitor_venv_dir: "{{ monitor_root_dir }}/venv"

# --- 监控系统配置 ---
monitor:
  server_host: "spt"           # 指定 Inventory 中哪台机器跑数据库
  server_url: "https://monitor.taoziyoyo.com"    # 监控服务地址 (客户端上报数据的目标地址)
  # 内部监听地址 (仅限本机)
  internal_host: "127.0.0.1"
  internal_port: 8000
  port: 8000                   # 监控服务端口
  token: "x8zK9#mP2$vL5@nQ"  # 上报认证 Token (客户端和服务端必须一致，建议修改为复杂字符串)
